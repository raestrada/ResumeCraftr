[tool.poetry]
name = "resumecraftr"
version = "0.8.2-beta1"
description = "AI-powered resume optimizer and ATS-friendly CV generator."
authors = ["Your Name <you@example.com>"]
license = "MIT"
packages = [
    { include = "resumecraftr" },
    { include = "resumecraftr/templates/*.md" },
    { include = "resumecraftr/templates/*.latex" }
]

include = [
    "resumecraftr/pdf/templates/*.html",
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
black = "^24.10.0"
chromadb = "^1.3.4"
click = ">=8.0"
ipdb = "^0.13.13"
langchain = "^1.0.4"
langchain-community = "^0.4.1"
langchain-openai = "^1.0.2"
langchain-anthropic = "^1.3.4"
langchain-text-splitters = "^1.0.0"
langgraph = "^1.0.2"
pydantic = ">=1.9"
python-dotenv = "^1.0.1"
rich = ">=12.0"
sentence-transformers = "^5.1.2"
PyMuPDF = "^1.26.6"

[tool.poetry.scripts]
resumecraftr = "resumecraftr.cli.main:cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
